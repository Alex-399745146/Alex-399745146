name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN достаточно: карточка строится только по этому профилю,
          # а разбивка по языкам живёт в отдельном workflow (languages.yml).
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Alex-399745146
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, metadata
          config_timezone: Europe/Moscow

          # Календарь активности за полгода
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
