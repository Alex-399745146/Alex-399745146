name: Languages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Собрать карточку языков
        env:
          GH_USER: Alex-399745146
          OUT_FILE: languages.svg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/languages.py

      - name: Закоммитить, если изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || git commit -m "Обновлена карточка языков"
          git push
